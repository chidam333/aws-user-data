# Nextcloud AIO on the homelab, reached over Tailscale.
# Based on https://github.com/nextcloud/all-in-one/blob/main/reverse-proxy.md (Nginx section).
# The 443 listener, certificate and HTTP->HTTPS redirect are added by certbot --nginx.
upstream nextcloud {
	keepalive 32;
	server 100.64.104.52:11000; # homelab tailnet IP : APACHE_PORT
}

server {
	listen [::]:80;
	server_name nextcloud.chidam.xyz;
	http2 on;

	proxy_buffering off;
	proxy_request_buffering off;
	proxy_socket_keepalive on;
	client_max_body_size 0;
	client_body_buffer_size 1m;

	# The default NEXTCLOUD_MAX_TIME is 3600s; stay 10s above it so Nextcloud times out first.
	proxy_read_timeout 3610s;

	location / {
		proxy_pass http://nextcloud;

		proxy_set_header Host              $host;
		proxy_set_header X-Forwarded-Host  $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

		# Websockets
		proxy_http_version 1.1;
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
	}
}
